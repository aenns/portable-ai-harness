[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "portable-ai-harness"
version = "0.1.0.dev2"
description = "Portable, configurable development tools with shared CLI and MCP services."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{name = "Adrian Enns"}]
dependencies = ["typer>=0.16,<1", "pydantic>=2.11,<3"]

[project.urls]
Repository = "https://github.com/aenns/portable-ai-harness"

[project.scripts]
pah = "portable_ai_harness.cli:app"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1", "jsonschema>=4.23,<5"]

[tool.hatch.build.targets.wheel]
packages = ["src/portable_ai_harness"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/scripts", "/docs", "/README.md", "/LICENSE", "/pyproject.toml", "/uv.lock", "/.python-version"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
