name: Portability acceptance
on:
  pull_request:
  push:
    branches: [main, step-04c-doctor-task-execution]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: portability-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  acceptance:
    name: acceptance (${{ matrix.os }}, Python 3.12)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      UV_PYTHON_DOWNLOADS: never
      UV_NO_PROGRESS: '1'
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install pinned uv
        run: python -m pip install uv==0.12.23
      - name: Locked dependencies
        run: uv sync --locked --python 3.12
      - name: Lint
        run: uv run --locked ruff check .
      - name: Format
        run: uv run --locked ruff format --check .
      - name: Unit and process integration tests
        run: uv run --locked pytest -q
      - name: Build distributions
        run: uv build
      - name: Install wheel and exercise commands outside checkout
        run: uv run --locked python scripts/smoke_install.py
      - name: Harness self-check
        run: uv run --locked pah check --yes
